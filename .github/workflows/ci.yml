name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download the Electron binary
        run: node node_modules/electron/install.js

      - name: Cache FFmpeg archive
        uses: actions/cache@v4
        with:
          path: .cache/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('scripts/ffmpeg-manifest.json') }}

      - name: Fetch pinned FFmpeg
        run: npm run fetch:ffmpeg

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Install Xvfb and Electron runtime libraries
        run: sudo apt-get update && sudo apt-get install -y xvfb libnss3 libgbm1 libasound2t64

      # Ubuntu 24.04 restricts unprivileged user namespaces, so Chromium needs its setuid helper.
      - name: Configure the Chromium sandbox helper
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox

      - name: E2E tests (Xvfb, X11)
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" npm run test:e2e

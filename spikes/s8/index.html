<!doctype html><meta charset="utf-8"><script>
async function openSource(id) {
  const t = Date.now();
  try {
    const s = await navigator.mediaDevices.getUserMedia({ audio: false, video: { mandatory: { chromeMediaSource: 'desktop', chromeMediaSourceId: id, maxWidth: 3840, maxHeight: 2160 } } });
    const ms = Date.now() - t;
    const track = s.getVideoTracks()[0];
    const reader = new MediaStreamTrackProcessor({ track }).readable.getReader();
    let frames = 0, size = 'none', stats = null;
    const until = Date.now() + 1500;
    while (Date.now() < until) {
      const r = await Promise.race([reader.read(), new Promise((res) => setTimeout(() => res({ timeout: true }), 1600))]);
      if (r.timeout || r.done) break;
      const f = r.value; frames++;
      if (frames === 3 || (!stats && Date.now() > until - 200)) {
        size = `${f.displayWidth}x${f.displayHeight}`;
        const c = new OffscreenCanvas(192, 108); const g = c.getContext('2d'); g.drawImage(f, 0, 0, 192, 108);
        const d = g.getImageData(0, 0, 192, 108).data; let sum = 0, sq = 0; const n = d.length / 4;
        for (let i = 0; i < d.length; i += 4) { const y = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]; sum += y; sq += y * y; }
        const mean = sum / n; stats = { meanLuma: +mean.toFixed(1), sdLuma: +Math.sqrt(sq / n - mean * mean).toFixed(1) };
      }
      f.close();
    }
    window.duringCapture = await window.dumpNodes?.();
    track.stop();
    return { ms, frame: size, frames, stats };
  } catch (e) { return { ms: Date.now() - t, error: String(e) }; }
}
</script>

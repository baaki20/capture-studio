# Packaging (spec §1.2, §1.10). Phase 1 ships AppImage and deb for Linux.
appId: org.capturestudio.CaptureStudio
productName: Capture Studio
executableName: capture-studio
copyright: Copyright © 2026 Capture Studio contributors

directories:
  buildResources: build
  output: dist

files:
  - out/**
  - package.json
  - '!**/*.map'

asar: true

# FFmpeg ships as separate executables next to the app, with its licence and source offer.
extraResources:
  - from: resources/bin/${platform}-${arch}
    to: bin/${platform}-${arch}
  - from: resources/licenses
    to: licenses
  - from: LICENSE
    to: LICENSE.txt

# Electron fuses (spec §1.3), flipped in the packaged binary.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  onlyLoadAppFromAsar: true
  enableEmbeddedAsarIntegrityValidation: true
  enableCookieEncryption: true

linux:
  target:
    - AppImage
    - deb
  category: AudioVideo
  synopsis: Screen recorder and teaching-focused video editor
  maintainer: Capture Studio contributors

deb:
  priority: optional

appImage:
  artifactName: ${productName}-${version}-${arch}.${ext}
